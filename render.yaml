services:
  - type: web
    name: userbot-hosting
    env: python
    plan: free
    region: oregon
    buildCommand: pip install -U pip && pip install -r requirements.txt
    startCommand: python -m Main.migrate && python -m Main
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PORT
        value: 8080
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: MONGO_URL
        sync: false
      - key: OWNER_ID
        sync: false
      - key: LOGGER_GROUP
        sync: false
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: BASE_URL
        sync: false
      - key: START_MEDIA_URL
        value: https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&q=80
